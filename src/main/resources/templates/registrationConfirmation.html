<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workshop Registration - Confirmation</title>
    <style>
        body { max-width: 800px; margin: 35px auto; padding: 0 20px; font-family: Arial, sans-serif; color: #263238; }
        h1 { color: #263238; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        table, td, th { border: 1px solid #cbd5dc; }
        th { background: #1769aa; color: white; padding: 12px; text-align: left; }
        td { padding: 10px; overflow-wrap: anywhere; }
        tr:nth-child(even) { background: #f2f5f7; }
        a { display: inline-block; margin-top: 20px; color: #1769aa; }
    </style>
</head>
<body>
<section>
    <header><h1>Workshop Registration - Confirmation</h1></header>
    <p>Your registration has been completed successfully.</p>
    <table>
        <tr><th colspan="2">Your Registration Status</th></tr>
        <tr><td><b>Participant Name</b></td><td th:text="${registration.participantName}"></td></tr>
        <tr><td><b>Participant Email</b></td><td th:text="${registration.participantEmail}"></td></tr>
        <tr><td><b>Client IP Address</b></td><td th:text="${clientIp}"></td></tr>
        <tr><td><b>Browser</b></td><td th:text="${browser}"></td></tr>
        <tr><td><b>Workshop</b></td><td th:text="${registration.workshopTitle}"></td></tr>
        <tr><td><b>Number of seats</b></td><td th:text="${registration.numberOfSeats}"></td></tr>
    </table>
    <p><a href="/">Back to workshops</a></p>
</section>
</body>
</html>
