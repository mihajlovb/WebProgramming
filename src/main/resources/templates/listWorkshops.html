<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workshop Registration - Choose a Workshop</title>
    <style>
        * { box-sizing: border-box; }
        body { max-width: 850px; margin: 35px auto; padding: 0 20px; font-family: Arial, sans-serif; color: #263238; }
        h1 { color: #263238; }
        form { margin-top: 22px; padding: 18px; border: 1px solid #dce3e8; border-radius: 8px; }
        label { display: inline-block; margin: 7px 8px 7px 0; }
        input[type="text"], input[type="email"], input[type="number"] { padding: 8px; margin: 5px 8px 5px 0; max-width: 100%; }
        input[type="submit"] { padding: 9px 15px; border: 0; border-radius: 5px; cursor: pointer; background: #1769aa; color: white; }
        .workshop-option { display: block; margin: 10px 0; padding: 12px; border: 1px solid #dce3e8; border-radius: 6px; }
        .workshop-option:hover { background: #f5f8fa; }
        .error { color: #c62828; font-weight: bold; }
        .muted { color: #667781; }
        .empty { padding: 12px; background: #f5f8fa; border-radius: 6px; }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <p class="error" th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}" th:text="${errorMessage}"></p>

    <form action="/" method="GET">
        <h2>Search workshops</h2>
        <label for="text">Title or category contains:</label>
        <input id="text" type="text" name="text" th:value="${searchText}">
        <label for="maxPrice">Max price (MKD):</label>
        <input id="maxPrice" type="number" name="maxPrice" min="0" step="0.01" th:value="${maxPrice}">
        <input type="submit" value="Search">
        <a href="/">Clear search</a>
    </form>

    <form action="/registration" method="POST">
        <h2>Choose a workshop</h2>
        <p class="muted">Workshops with no free seats remain visible but cannot be selected.</p>
        <p class="empty" th:if="${noResults}">No workshops match your search.</p>
        <label class="workshop-option" th:each="workshop : ${workshops}">
            <input type="radio" name="workshopTitle" th:value="${workshop.title}"
                   th:disabled="${workshop.capacity == 0}" required>
            <span th:text="'Title: ' + ${workshop.title} + ', Category: ' + ${workshop.category} + ', Price: ' + ${workshop.price} + ' MKD, Free seats: ' + ${workshop.capacity}"></span>
            <span class="muted" th:if="${workshop.capacity == 0}">(Full)</span>
        </label>

        <h2>Enter your information</h2>
        <div>
            <label for="participantName">Your name:</label>
            <input id="participantName" type="text" name="participantName" required>
        </div>
        <div>
            <label for="participantEmail">Your email:</label>
            <input id="participantEmail" type="email" name="participantEmail" required>
        </div>
        <h2>Choose number of seats</h2>
        <label for="numSeats">Number of seats:</label>
        <input id="numSeats" type="number" name="numSeats" min="1" required>
        <br><br>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>
